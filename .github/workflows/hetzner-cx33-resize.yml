name: Hetzner cx33 external resize

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESIZE to power off server 128108518, resize cx23 -> cx33, and power it back on"
        required: true
        type: string
      expected_server_name:
        description: "Expected Hetzner server name"
        required: true
        default: "ubuntu-4gb-fsn1-1"
        type: string
      expected_source_type:
        description: "Expected current server type before resize"
        required: true
        default: "cx23"
        type: string
      target_type:
        description: "Target server type"
        required: true
        default: "cx33"
        type: string
      telegram_chat_id:
        description: "Telegram chat id to notify"
        required: true
        default: "1946886560"
        type: string

permissions:
  contents: read

concurrency:
  group: hetzner-cx33-resize-128108518
  cancel-in-progress: false

env:
  SERVER_ID: "128108518"
  HETZNER_API: "https://api.hetzner.cloud/v1"

jobs:
  resize:
    name: Verify, resize externally, and notify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate dispatch confirmation and secrets
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
          SOURCE_TYPE: ${{ inputs.expected_source_type }}
          TARGET_TYPE: ${{ inputs.target_type }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "RESIZE" ]]; then
            echo "confirm input must be exactly RESIZE" >&2
            exit 64
          fi
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "Missing required repo secret HCLOUD_TOKEN" >&2
            exit 65
          fi
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "Missing required repo secret TELEGRAM_BOT_TOKEN" >&2
            exit 65
          fi
          if [[ "$SOURCE_TYPE" != "cx23" || "$TARGET_TYPE" != "cx33" ]]; then
            echo "This guarded workflow is intentionally scoped to cx23 -> cx33 only." >&2
            exit 66
          fi

      - name: Verify target server and cx33 availability
        id: verify
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          EXPECTED_SERVER_NAME: ${{ inputs.expected_server_name }}
          EXPECTED_SOURCE_TYPE: ${{ inputs.expected_source_type }}
          TARGET_TYPE: ${{ inputs.target_type }}
        run: |
          set -euo pipefail

          api_get() {
            curl -fsS --retry 3 --retry-all-errors --max-time 30 \
              -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
              -H "Accept: application/json" \
              "$1"
          }

          server_json="$(api_get "${HETZNER_API}/servers/${SERVER_ID}")"
          server_id="$(jq -r '.server.id' <<<"$server_json")"
          server_name="$(jq -r '.server.name' <<<"$server_json")"
          current_type="$(jq -r '.server.server_type.name' <<<"$server_json")"
          status="$(jq -r '.server.status' <<<"$server_json")"
          dc_id="$(jq -r '.server.datacenter.id' <<<"$server_json")"
          dc_name="$(jq -r '.server.datacenter.name' <<<"$server_json")"

          echo "server_name=$server_name" >> "$GITHUB_OUTPUT"
          echo "dc_name=$dc_name" >> "$GITHUB_OUTPUT"
          echo "current_type=$current_type" >> "$GITHUB_OUTPUT"

          echo "Server ${server_id} (${server_name}) is ${current_type}, status=${status}, datacenter=${dc_name}."

          if [[ "$server_id" != "$SERVER_ID" ]]; then
            echo "Unexpected server id: ${server_id}" >&2
            exit 70
          fi
          if [[ "$server_name" != "$EXPECTED_SERVER_NAME" ]]; then
            echo "Unexpected server name: ${server_name}; expected ${EXPECTED_SERVER_NAME}" >&2
            exit 71
          fi
          if [[ "$current_type" == "$TARGET_TYPE" ]]; then
            echo "already_target=true" >> "$GITHUB_OUTPUT"
            echo "Server is already ${TARGET_TYPE}; no resize needed."
            exit 0
          fi
          echo "already_target=false" >> "$GITHUB_OUTPUT"
          if [[ "$current_type" != "$EXPECTED_SOURCE_TYPE" ]]; then
            echo "Unexpected source type: ${current_type}; expected ${EXPECTED_SOURCE_TYPE}" >&2
            exit 72
          fi
          if [[ "$status" != "running" ]]; then
            echo "Unexpected server status before resize: ${status}; expected running" >&2
            exit 73
          fi

          types_json="$(api_get "${HETZNER_API}/server_types")"
          target_id="$(jq -r --arg name "$TARGET_TYPE" '.server_types[] | select(.name == $name) | .id' <<<"$types_json")"
          if [[ -z "$target_id" || "$target_id" == "null" ]]; then
            echo "Could not resolve target server type id for ${TARGET_TYPE}" >&2
            exit 74
          fi
          echo "target_type_id=$target_id" >> "$GITHUB_OUTPUT"

          dc_json="$(api_get "${HETZNER_API}/datacenters/${dc_id}")"
          available="$(jq -r --argjson id "$target_id" '(
            (.datacenter.server_types.available // [])
            + (.datacenter.server_types.available_for_migration // [])
          ) | any(. == $id)' <<<"$dc_json")"
          echo "Target ${TARGET_TYPE} id ${target_id} availability in ${dc_name}: ${available}."
          if [[ "$available" != "true" ]]; then
            echo "${TARGET_TYPE} id ${target_id} is not currently available/available_for_migration in ${dc_name}" >&2
            exit 75
          fi

      - name: Power off target server
        if: steps.verify.outputs.already_target != 'true'
        id: poweroff
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -X POST \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            -H "Content-Type: application/json" \
            "${HETZNER_API}/servers/${SERVER_ID}/actions/poweroff")"
          action_id="$(jq -r '.action.id' <<<"$response")"
          echo "action_id=${action_id}" >> "$GITHUB_OUTPUT"
          echo "Poweroff action ${action_id} started."

      - name: Wait for power off
        if: steps.verify.outputs.already_target != 'true'
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          ACTION_ID: ${{ steps.poweroff.outputs.action_id }}
        run: |
          set -euo pipefail
          final_action_status="unknown"
          for i in $(seq 1 60); do
            action_json="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -H "Authorization: Bearer ${HCLOUD_TOKEN}" "${HETZNER_API}/servers/${SERVER_ID}/actions/${ACTION_ID}")"
            final_action_status="$(jq -r '.action.status' <<<"$action_json")"
            echo "poweroff action status: ${final_action_status}"
            if [[ "$final_action_status" == "success" ]]; then
              break
            fi
            if [[ "$final_action_status" == "error" ]]; then
              jq -r '.action.error // empty' <<<"$action_json" >&2
              exit 80
            fi
            sleep 5
          done
          if [[ "$final_action_status" != "success" ]]; then
            echo "Timed out waiting for poweroff action ${ACTION_ID}" >&2
            exit 80
          fi
          server_status="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -H "Authorization: Bearer ${HCLOUD_TOKEN}" "${HETZNER_API}/servers/${SERVER_ID}" | jq -r '.server.status')"
          if [[ "$server_status" != "off" ]]; then
            echo "Server status is ${server_status}; expected off" >&2
            exit 81
          fi

      - name: Change type to cx33 and grow disk
        if: steps.verify.outputs.already_target != 'true'
        id: changetype
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TARGET_TYPE: ${{ inputs.target_type }}
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -X POST \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"server_type\":\"${TARGET_TYPE}\",\"upgrade_disk\":true}" \
            "${HETZNER_API}/servers/${SERVER_ID}/actions/change_type")"
          action_id="$(jq -r '.action.id' <<<"$response")"
          echo "action_id=${action_id}" >> "$GITHUB_OUTPUT"
          echo "change_type action ${action_id} started with upgrade_disk=true."

      - name: Wait for type change
        if: steps.verify.outputs.already_target != 'true'
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          ACTION_ID: ${{ steps.changetype.outputs.action_id }}
        run: |
          set -euo pipefail
          final_action_status="unknown"
          for i in $(seq 1 90); do
            action_json="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -H "Authorization: Bearer ${HCLOUD_TOKEN}" "${HETZNER_API}/servers/${SERVER_ID}/actions/${ACTION_ID}")"
            final_action_status="$(jq -r '.action.status' <<<"$action_json")"
            echo "change_type action status: ${final_action_status}"
            if [[ "$final_action_status" == "success" ]]; then
              break
            fi
            if [[ "$final_action_status" == "error" ]]; then
              jq -r '.action.error // empty' <<<"$action_json" >&2
              exit 82
            fi
            sleep 5
          done
          if [[ "$final_action_status" != "success" ]]; then
            echo "Timed out waiting for change_type action ${ACTION_ID}" >&2
            exit 82
          fi
          new_type="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -H "Authorization: Bearer ${HCLOUD_TOKEN}" "${HETZNER_API}/servers/${SERVER_ID}" | jq -r '.server.server_type.name')"
          if [[ "$new_type" != "cx33" ]]; then
            echo "Server type is ${new_type}; expected cx33" >&2
            exit 83
          fi

      - name: Power on target server
        if: steps.verify.outputs.already_target != 'true'
        id: poweron
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -X POST \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            -H "Content-Type: application/json" \
            "${HETZNER_API}/servers/${SERVER_ID}/actions/poweron")"
          action_id="$(jq -r '.action.id' <<<"$response")"
          echo "action_id=${action_id}" >> "$GITHUB_OUTPUT"
          echo "poweron action ${action_id} started."

      - name: Wait for running server
        if: steps.verify.outputs.already_target != 'true'
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          ACTION_ID: ${{ steps.poweron.outputs.action_id }}
        run: |
          set -euo pipefail
          final_action_status="unknown"
          for i in $(seq 1 60); do
            action_json="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -H "Authorization: Bearer ${HCLOUD_TOKEN}" "${HETZNER_API}/servers/${SERVER_ID}/actions/${ACTION_ID}")"
            final_action_status="$(jq -r '.action.status' <<<"$action_json")"
            echo "poweron action status: ${final_action_status}"
            if [[ "$final_action_status" == "success" ]]; then
              break
            fi
            if [[ "$final_action_status" == "error" ]]; then
              jq -r '.action.error // empty' <<<"$action_json" >&2
              exit 84
            fi
            sleep 5
          done
          if [[ "$final_action_status" != "success" ]]; then
            echo "Timed out waiting for poweron action ${ACTION_ID}" >&2
            exit 84
          fi
          final_json="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 -H "Authorization: Bearer ${HCLOUD_TOKEN}" "${HETZNER_API}/servers/${SERVER_ID}")"
          final_status="$(jq -r '.server.status' <<<"$final_json")"
          final_type="$(jq -r '.server.server_type.name' <<<"$final_json")"
          if [[ "$final_status" != "running" || "$final_type" != "cx33" ]]; then
            echo "Final status/type is ${final_status}/${final_type}; expected running/cx33" >&2
            exit 85
          fi

      - name: Notify Telegram success
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          SERVER_NAME: ${{ steps.verify.outputs.server_name }}
          DC_NAME: ${{ steps.verify.outputs.dc_name }}
          ALREADY_TARGET: ${{ steps.verify.outputs.already_target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$ALREADY_TARGET" == "true" ]]; then
            text="Hetzner resize workflow: server ${SERVER_ID} (${SERVER_NAME}) is already cx33 in ${DC_NAME}; no action taken. ${RUN_URL}"
          else
            text="Hetzner resize workflow: server ${SERVER_ID} (${SERVER_NAME}) resized from cx23 to cx33 and powered back on in ${DC_NAME}. ${RUN_URL}"
          fi
          curl -fsS --retry 3 --retry-all-errors --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null

      - name: Notify Telegram failure
        if: failure()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          text="Hetzner resize workflow FAILED for server ${SERVER_ID}. Check logs: ${RUN_URL}"
          curl -fsS --retry 3 --retry-all-errors --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null
